[package]
name = "litebridge-desktop"
version = "1.1.1"
description = "LiteBridge Desktop - Open-Source Desktop Orchestrator for LiteLLM & Agent Harnesses"
authors = ["LiteBridge Team"]
license = "MIT"
repository = "https://github.com/lucascborges/LiteBridge-Desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
which = "6.0"
regex = "1.10"
url = "2.5"
sysinfo = "0.30"
once_cell = "1.19"

[lib]
name = "litebridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
